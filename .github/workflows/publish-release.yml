name: Publish Valorant Shop Checker release
on:
  push:
    branches: [main]
    paths: [ValorantShopCheckerSetup.exe, release.json, RELEASE_NOTES.md, .github/workflows/publish-release.yml]
permissions:
  contents: write
concurrency:
  group: valorantshopchecker-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact pushed files
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Validate installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          manifest = json.loads(pathlib.Path('release.json').read_text(encoding='utf-8-sig'))
          version = manifest['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Version must have three parts')
          if json.loads(pathlib.Path('version.json').read_text())['version'] != version:
              raise SystemExit('Source and installer versions differ. Run Build.ps1.')
          installer = pathlib.Path('ValorantShopCheckerSetup.exe').read_bytes()
          if installer[:2] != b'MZ' or hashlib.sha256(installer).hexdigest() != manifest['sha256']:
              raise SystemExit('Installer differs from release.json. Run Build.ps1.')
          pathlib.Path('release-tag.txt').write_text('v' + version)
          PY
          RELEASE_TAG="$(cat release-tag.txt)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This version already exists. Increase version.json and rebuild."
            exit 1
          fi
          gh release create "$RELEASE_TAG" ValorantShopCheckerSetup.exe ValorantShopChecker.exe release.json --target "$GITHUB_SHA" --title "Valorant Shop Checker $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
